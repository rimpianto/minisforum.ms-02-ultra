[package]
name = "amt-wsman"
version = "0.1.0"
edition = "2021"
description = "WS‑Man SOAP client for Intel AMT – power control"

[dependencies]
uuid = { version = "1.4", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
http-auth = { version = "0.1", features = ["digest-scheme"] }

[dev-dependencies]
# (none needed yet)
