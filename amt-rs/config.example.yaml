# Copy to ~/.config/amt/config.yaml (or $XDG_CONFIG_HOME/amt/config.yaml,
# or anywhere with AMT_CONFIG=/path/to/config.yaml) and chmod 600.
# ~/.amt/config.yaml is still read, for configs written before the move.
# No credentials are ever committed.
#
# Any number of machines, one used at a time. `default:` is what a bare
# command talks to; `--machine <name>` (or AMT_MACHINE) picks another one,
# and `amt-cli machines` lists them.
default: ms02

machines:
  ms02:
    host: 192.168.99.153   # AMT of the Minisforum MS-02 Ultra
    port: 16993            # WS-Man over TLS; 16992 is closed on this firmware
    username: admin
    password: CHANGE_ME

  lab:
    host: 192.168.99.160
    port: 16993
    username: admin
    password: CHANGE_ME
    # Where the redirection service (KVM, SOL) listens. The firmware puts it
    # two ports above WS-Man, which is what happens when this is omitted.
    redirection_port: 16995

# The older single-machine form still loads, so a config written before
# multiple machines existed keeps working:
#
# amt:
#   host: 192.168.99.153
#   port: 16993
#   username: admin
#   password: CHANGE_ME
